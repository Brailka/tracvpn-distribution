name: Publish tracVPN catalog

on:
  push:
    branches: [main]
    paths:
      - Tracservis/servis.txt
      - scripts/build_catalog.py
      - .github/workflows/publish.yml
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-catalog
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate servers and generate catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_catalog.py
      - name: Commit catalog when changed
        run: |
          if git diff --quiet -- catalog.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Update tracVPN catalog"
          git push
